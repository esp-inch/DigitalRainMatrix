; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Esp32-S3-WintryMix

[env:Esp32-S3-WROOM1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed=921600
monitor_speed = 115200
lib_deps =
	fastled/FastLED@^3.6.0
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.10
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.15.0
	paulstoffregen/OneWire@^2.3.8
build_flags =
	-DDISABLE_ALL_LIBRARY_WARNINGS
    -DCORE_DEBUG_LEVEL=3
    -DNO_GFX=1
	-DESP32_SXXX=1
	-DESP32_S3=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================================
; ESP32-S3 Effect Mode Environments
; ============================================================================

[env:Esp32-S3-WintryMix]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed=921600
monitor_speed = 115200
lib_deps =
	fastled/FastLED@^3.6.0
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.10
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.15.0
	paulstoffregen/OneWire@^2.3.8
build_flags =
	-DDISABLE_ALL_LIBRARY_WARNINGS
    -DCORE_DEBUG_LEVEL=3
    -DNO_GFX=1
	-DESP32_SXXX=1
	-DESP32_S3=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DEFFECT_MODE=0
	-DDROPLET_COLOR=0x8AF9FF
	-DHEAD_COLOR=0xFFFFFF
	-DTEMP_CHANGE_INTERVAL=3000
	-DSTART_TEMP=33

